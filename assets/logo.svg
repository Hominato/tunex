      <linearGradient id="bnpGreen" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#00A261" />
        <stop offset="100%" stop-color="#007945" />
      </linearGradient>
    </defs>
    <rect width="100" height="100" rx="16" fill="url(#bnpGreen)" />
