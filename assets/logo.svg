<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 120" width="100%" height="100%">
  <defs>
    <linearGradient id="logoGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="50%" stop-color="#1D4ED8" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
    <linearGradient id="goldAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#3B82F6" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Emblem Icon -->
  <g transform="translate(10, 10)">
    <rect x="0" y="0" width="100" height="100" rx="24" fill="url(#logoGlow)" filter="url(#shadow)" />
    <!-- Dynamic Hexagon / Diamond Crest -->
    <path d="M50 20 L80 37 L80 63 L50 80 L20 63 L20 37 Z" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" opacity="0.9" />
    <path d="M50 28 L72 41 L72 59 L50 72 L28 59 L28 41 Z" fill="none" stroke="url(#goldAccent)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="50" cy="50" r="10" fill="#FFFFFF" />
    <path d="M44 50 L56 50 M50 44 L50 56" stroke="#1D4ED8" stroke-width="3" stroke-linecap="round" />
  </g>

  <!-- Brand Typography -->
  <text x="130" y="68" font-family="'Plus Jakarta Sans', 'Inter', system-ui, sans-serif" font-weight="800" font-size="44" fill="#FFFFFF" letter-spacing="2">
    TUNEX
  </text>
  <text x="132" y="92" font-family="'Plus Jakarta Sans', 'Inter', system-ui, sans-serif" font-weight="600" font-size="14" fill="#10B981" letter-spacing="4">
    PRIVATE BANKING
  </text>
</svg>
