<!DOCTYPE html>
<html lang="en" data-theme="dark">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BNP Paribas Securities Corp - Login</title>
  <meta name="description" content="Secure digital banking authentication portal.">
  <!-- Favicon -->
  <link rel="icon" type="image/png" href="assets/logo.png?v=3">
  <link rel="apple-touch-icon" href="assets/logo.png?v=3">
  <meta name="theme-color" content="#0A0F1D">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/animations.css">
  <style>
    .login-container {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      position: relative;
      z-index: 2;
    }

    .login-card {
      width: 100%;
      max-width: 440px;
      padding: 40px;
      background: rgba(17, 24, 39, 0.75);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius-xl);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
    }

    .login-logo {
      text-align: center;
      margin-bottom: 32px;
    }

    .login-logo svg {
      width: 220px;
      height: 55px;
    }

    .login-header {
      text-align: center;
      margin-bottom: 28px;
    }

    .login-header h2 {
      font-size: 1.6rem;
      margin-bottom: 6px;
    }

    .login-header p {
      font-size: 0.88rem;
    }

    .login-options {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 24px;
      font-size: 0.85rem;
    }

    .remember-me {
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      color: var(--text-secondary);
    }

    .remember-me input {
      accent-color: var(--accent-blue);
      width: 16px;
      height: 16px;
    }

    .forgot-link {
      color: var(--accent-blue);
      font-weight: 600;
    }

    .btn-login {
      width: 100%;
      padding: 14px;
      font-size: 1rem;
      font-weight: 700;
    }

    .login-footer-info {
      margin-top: 24px;
      text-align: center;
      font-size: 0.78rem;
      color: var(--text-muted);
    }

    @media (max-width: 480px) {
      .login-card {
        padding: 24px 16px;
        border-radius: var(--radius-lg);
      }

      .login-logo img {
        width: 70px !important;
        height: 70px !important;
      }

      .login-header h2 {
        font-size: 1.3rem;
      }

      .login-header p {
        font-size: 0.8rem;
      }

      .login-options {
        flex-direction: column;
        align-items: flex-start;
        gap: 12px;
      }
    }
  </style>
</head>

<body>

  <!-- Ambient Light Blobs -->
  <div class="ambient-bg">
    <div class="ambient-blob blob-1"></div>
    <div class="ambient-blob blob-2"></div>
    <div class="ambient-blob blob-3"></div>
  </div>

  <!-- Disclaimer Banner -->


  <main class="login-container">
    <div class="login-card slide-up">
      <div class="login-logo" style="text-align: center; margin-bottom: 24px;">
        <img src="assets/logo.png?v=3" alt="BNP Paribas Securities Corp Logo"
          style="width: 220px; height: 110px; object-fit: contain; border-radius: var(--radius-lg); box-shadow: 0 8px 24px rgba(0,0,0,0.3); border: 1px solid var(--glass-border);">
      </div>

      <div class="login-header">
        <h2>Welcome Back</h2>
        <p>Enter your credentials to access Private Banking</p>
      </div>

      <form id="loginForm" onsubmit="App.handleLogin(event)">
        <div class="form-group">
          <label class="form-label" for="username">Email / Account ID</label>
          <div class="input-with-icon">
            <span class="input-icon">
              <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="2">
                <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2" />
                <circle cx="12" cy="7" r="4" />
              </svg>
            </span>
            <input type="text" id="username" class="form-control" value="anita.ao.cib.bnpparibas@zohomail.com" required
              placeholder="e.g. anita.ao.cib.bnpparibas@zohomail.com">
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="password">Password</label>
          <div class="input-with-icon">
            <span class="input-icon">
              <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="2">
                <rect x="3" y="11" width="18" height="11" rx="2" ry="2" />
                <path d="M7 11V7a5 5 0 0 1 10 0v4" />
              </svg>
            </span>
            <input type="password" id="password" class="form-control" value="DavidMck@3000" required
              placeholder="Enter password">
            <button type="button" class="input-toggle-pwd" onclick="App.togglePasswordVisibility()">
              <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="2">
                <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z" />
                <circle cx="12" cy="12" r="3" />
              </svg>
            </button>
          </div>
        </div>

        <div class="login-options">
          <label class="remember-me">
            <input type="checkbox" id="rememberMe" checked>
            <span>Remember Me</span>
          </label>
          <a href="#" class="forgot-link" onclick="App.handleForgot(event)">Forgot Password?</a>
        </div>

        <button type="submit" id="loginBtn" class="btn btn-primary btn-login">
          <span>Secure Sign In</span>
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2">
            <line x1="5" y1="12" x2="19" y2="12" />
            <polyline points="12 5 19 12 12 19" />
          </svg>
        </button>
      </form>

      <div class="login-footer-info">
        <p>Encrypted 256-bit SSL Session • Customer ID: <strong>BNK-8492041</strong></p>
      </div>
    </div>
  </main>


  <script src="js/storage.js"></script>
  <script src="js/helpers.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      UI.init();
      App.initLogin();
    });
  </script>
</body>

</html>
